
name: NIDS - Continuous Integration

on:
  workflow_dispatch:

  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.pdf'
      - 'docs/**'

  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.pdf'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: nids-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Python Tests and Repository Audit
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-windows.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-windows.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Create report directory
        run: python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"

      - name: Run unit and smoke tests
        run: |
          python -m pytest -q tests test_cic_flow_extractor.py --import-mode=importlib --junitxml=reports/ci_pytest.xml

      - name: Audit repository
        if: ${{ !cancelled() }}
        run: python scripts/sprint1_audit.py

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nids-windows-ci-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/ci_pytest.xml
            reports/environment_audit.md
            reports/environment_audit.json
            reports/dataset_inventory.json
